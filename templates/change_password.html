{% extends 'base.html' %}
{% block content %}
<h2>Change Password</h2>

<form method="POST">
  <label>Current Password</label><br>
  <div class="password-wrapper">
    <input type="password" name="current_password" id="current_password" required>
    <button type="button" class="eye-btn" onclick="toggleVisibility('current_password', this)">👁</button>
  </div><br><br>

  <label>New Password</label><br>
  <div class="password-wrapper">
    <input type="password" name="new_password" id="new_password" minlength="6" required>
    <button type="button" class="eye-btn" onclick="toggleVisibility('new_password', this)">👁</button>
  </div><br><br>

  <label>Confirm New Password</label><br>
  <div class="password-wrapper">
    <input type="password" name="confirm_password" id="confirm_password" required>
    <button type="button" class="eye-btn" onclick="toggleVisibility('confirm_password', this)">👁</button>
  </div><br><br>

  <button type="submit">Change Password</button>
</form>

<br>
<a href="{{ url_for('dashboard') }}">← Back to dashboard</a>

<script>
function toggleVisibility(fieldId, btn) {
  const input = document.getElementById(fieldId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁';
  }
}
</script>
{% endblock %}
