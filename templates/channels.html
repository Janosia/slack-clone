{% extends 'base.html' %}
{% block content %}

<div class="chat-header">
  <h2>#{{ channel.name }}</h2>
  <span class="workspace">in {{ channel.workspace_name }}</span>

  {% if channel.channel_type == 'private' %}
    <a class="invite-btn" href="{{ url_for('invite_to_channel', channel_id=channel.channel_id) }}">
      + Invite User
    </a>
  {% endif %}
</div>

<form method="GET" class="search-bar">
  <input name="search" placeholder="🔍 Search messages..." value="{{ keyword }}">
  <button type="submit">Search</button>
</form>

<div class="messages">
  {% for msg in messages %}
    <div class="message-wrapper {% if msg.username == session.username %}me{% else %}other{% endif %}">
      <div class="message">
        <div class="meta">
          <strong>{{ msg.username }}</strong>
          <span class="time">{{ msg.created_at }}</span>
        </div>
        <div class="text">
          {{ msg.body }}
        </div>
      </div>
    </div>
  {% endfor %}
</div>

<form method="POST"
      action="{{ url_for('post_message', channel_id=channel.channel_id) }}"
      class="message-form">

  <textarea name="body" placeholder="Write a message..." required></textarea>

  <button type="submit">Send 💬</button>
</form>
<script>
window.onload = function () {
    const box = document.querySelector(".messages");
    if (box) {
        box.scrollTop = box.scrollHeight;
    }
};
</script>
{% endblock %}
